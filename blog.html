    .page-wrap {

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      color: var(--muted);
      text-decoration: none;
      margin-bottom: 56px;

      padding: 64px 0;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .blog-empty-icon { color: var(--muted); }

    .blog-empty h2 {
      font-size: 18px;
      font-weight: 500;
      color: var(--ink);
    }

    .blog-empty p {
      font-size: 15px;
      font-weight: 400;
      color: var(--muted);
      max-width: 400px;
      line-height: 1.6;
    }

    .blog-list { display: flex; flex-direction: column; gap: 0; }
    .blog-post-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
      transition: opacity 0.33s;
    }
    .blog-post-item:hover { opacity: 0.6; }
    .blog-post-item:first-child { border-top: 1px solid var(--line); }
    .post-title { font-size: 18px; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
    .post-excerpt { font-size: 14px; font-weight: 400; color: var(--muted); line-height: 1.6; }
    .post-date { font-size: 13px; color: var(--muted); white-space: nowrap; flex-shrink: 0; padding-top: 3px; }
