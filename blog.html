<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Radan Bahrami</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="icon" href="assets/whitelogoclean.png" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    /* Page-specific styles; shared vars/nav/footer are in /assets/styles.css */
    .page-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: calc(var(--nav-h) + 80px) 24px 120px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--gray-400);
      text-decoration: none;
      margin-bottom: 56px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--black); }

    .page-eyebrow {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 16px;
    }

    .page-title {
      font-size: clamp(36px, 6vw, 60px);
      font-weight: 600;
      letter-spacing: -0.04em;
      color: var(--black);
      margin-bottom: 16px;
      line-height: 1.05;
    }

    .page-subtitle {
      font-size: 16px;
      font-weight: 300;
      color: var(--gray-400);
      margin-bottom: 72px;
    }

    /* Empty state */
    .blog-empty {
      border: 1px dashed var(--gray-200);
      border-radius: 18px;
      padding: 80px 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .blog-empty-icon {
      color: var(--gray-200);
      margin-bottom: 8px;
    }

    .blog-empty h2 {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--gray-800);
    }

    .blog-empty p {
      font-size: 15px;
      font-weight: 300;
      color: var(--gray-400);
      max-width: 320px;
      line-height: 1.6;
    }

    /* Blog post list (for when posts exist) */
    .blog-list { display: flex; flex-direction: column; gap: 0; }
    .blog-post-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 0;
      border-bottom: 1px solid var(--gray-200);
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s;
    }
    .blog-post-item:hover { opacity: 0.6; }
    .blog-post-item:first-child { border-top: 1px solid var(--gray-200); }
    .post-title { font-size: 18px; font-weight: 500; letter-spacing: -0.02em; color: var(--black); margin-bottom: 6px; }
    .post-excerpt { font-size: 14px; font-weight: 300; color: var(--gray-600); line-height: 1.6; }
    .post-date { font-size: 13px; color: var(--gray-400); white-space: nowrap; flex-shrink: 0; padding-top: 3px; }

    footer {
      border-top: 1px solid var(--gray-200);
      padding: 32px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .footer-copy { font-size: 13px; color: var(--gray-400); }
    .footer-links { display: flex; gap: 24px; }
    .footer-links a { font-size: 13px; color: var(--gray-400); text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: var(--black); }

    @media (max-width: 768px) {
      nav { padding: 0 20px; }
      .nav-links { display: none; }
      .nav-hamburger { display: flex; }
      .blog-empty { padding: 60px 24px; }
      footer { padding: 24px 20px; flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="/">
      <i data-lucide="code" width="28" height="28"></i>
      <span style="display:none;font-size:16px;font-weight:600;letter-spacing:-0.03em;">RB</span>
    </a>
    <ul class="nav-links">
      <li><a href="/about.html" class="grow-link">About</a></li>
      <li><a href="/blog.html" class="grow-link active">Blog</a></li>
      <li><a href="/#contact" class="grow-link">Contact</a></li>
    </ul>
    <button class="nav-hamburger" id="navHamburger" onclick="toggleMenu()" aria-label="Open menu" aria-expanded="false">
      <span class="hamburger-box" aria-hidden="true">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </span>
    </button>
  </nav>

  <div class="nav-mobile-overlay" id="mobileNav">
    <button class="nav-mobile-close" onclick="closeMenu()" aria-label="Close menu">
      <i data-lucide="x" width="26" height="26"></i>
    </button>
    <a class="grow-link" href="/about.html" onclick="closeMenu()">About</a>
    <a class="grow-link" href="/blog.html" onclick="closeMenu()">Blog</a>
    <a class="grow-link" href="/#contact" onclick="closeMenu()">Contact</a>
  </div>

  <div class="page-wrap">
    <a class="back-link" href="/">
      <i data-lucide="arrow-left" width="14" height="14"></i>
      Back
    </a>
    <h1 class="page-title">Blog</h1>
    <p class="page-subtitle">Thoughts on AI, automation, and building things.</p>

    <!-- Empty state shown until posts exist -->
    <div class="blog-empty" id="emptyState">
      <div class="blog-empty-icon">
        <i data-lucide="pencil-line" width="40" height="40"></i>
      </div>
      <h2>Nothing here yet.</h2>
      <p>I'll be sharing thoughts on AI, building software, and lessons from freelancing. Check back soon.</p>
    </div>

    <!-- Blog post list — hidden by default, show when posts added -->
    <div class="blog-list" id="blogList" style="display:none;">
      <!-- Posts will go here. Example structure:
      <a class="blog-post-item" href="/blog/post-slug.html">
        <div>
          <p class="post-title">Title goes here</p>
          <p class="post-excerpt">Short excerpt or description.</p>
        </div>
        <span class="post-date">May 2026</span>
      </a>
      -->
    </div>
  </div>

  <footer>
    <p class="footer-copy">© <script>document.write(new Date().getFullYear())</script></p>
    <div class="footer-links">
      <a class="grow-link" href="/about.html">About</a>
      <a class="grow-link" href="/blog.html">Blog</a>
      <a class="grow-link" href="/#contact">Contact</a>
    </div>
  </footer>

  <script>
    lucide.createIcons();
    function setMenuState(isOpen) {
      const menu = document.getElementById('mobileNav');
      const hamburger = document.getElementById('navHamburger');
      menu.classList.toggle('open', isOpen);
      hamburger.classList.toggle('open', isOpen);
      hamburger.setAttribute('aria-expanded', isOpen);
      hamburger.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
      document.body.style.overflow = isOpen ? 'hidden' : '';
    }
    function toggleMenu() { setMenuState(!document.getElementById('mobileNav').classList.contains('open')); }
    function closeMenu() { setMenuState(false); }
  </script>
</body>
</html>
